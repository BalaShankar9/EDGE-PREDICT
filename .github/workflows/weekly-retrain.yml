name: Weekly Retrain
on:
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:
jobs:
  retrain:
    runs-on: ubuntu-latest
    steps:
      - name: Retrain model
        env:
          API_URL: ${{ secrets.API_URL }}
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          curl -sf -X POST "${API_URL}/api/pipeline/retrain" \
            -H "X-API-Key: ${API_KEY}" \
            -H "Content-Type: application/json" \
            --max-time 600
