name: Resolve Results
on:
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch:
jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve yesterday's picks
        env:
          API_URL: ${{ secrets.API_URL }}
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          curl -sf -X POST "${API_URL}/api/pipeline/resolve" \
            -H "X-API-Key: ${API_KEY}" \
            -H "Content-Type: application/json" \
            --max-time 120
