name: Daily Predictions
on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:
jobs:
  predict:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger daily pipeline
        env:
          API_URL: ${{ secrets.API_URL }}
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          curl -sf -X POST "${API_URL}/api/pipeline/run" \
            -H "X-API-Key: ${API_KEY}" \
            -H "Content-Type: application/json" \
            --max-time 300
