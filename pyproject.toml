[project]
name = "sharpedge"
version = "0.1.0"
description = "AI-powered football prediction engine"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "psycopg2-binary>=2.9",
    "pandas>=2.1",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5.1",
    "soccerdata>=1.7",
    "thefuzz[speedup]>=0.22",
    "python-dotenv>=1.0",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "apscheduler>=3.10",
    "tenacity>=8.2",
    "httpx>=0.27",
    "python-telegram-bot>=21.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "pytest-mock>=3.12",
    "ruff>=0.3",
    "mypy>=1.8",
]
ml = [
    "xgboost>=2.0",
    "scikit-learn>=1.4",
    "scipy>=1.12",
    "optuna>=3.5",
    "shap>=0.44",
    "mlflow>=2.10",
]
api = [
    "fastapi>=0.109",
    "uvicorn[standard]>=0.27",
]

[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py311"
line-length = 100
